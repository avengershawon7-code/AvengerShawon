<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAWON | Elite Designer Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
        
        :root {
            --primary: #00ff88;
            --secondary: #00ffee;
            --bg: #030303;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Animated Background Gradient */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #00ff8815, transparent);
            z-index: -1;
        }

        /* Header Styling */
        header {
            padding: 80px 20px;
            text-align: center;
        }

        .profile-container {
            position: relative;
            display: inline-block;
        }

        .profile-ring {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            animation: rotate 5s linear infinite;
        }

        @keyframes rotate { 100% { filter: hue-rotate(360deg); } }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--bg);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin: 20px 0 10px;
            letter-spacing: 6px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0.8;
        }

        /* Portfolio Grid */
        .container { padding: 60px 5%; }
        
        .section-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 50px;
            text-align: center;
            letter-spacing: 3px;
            color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.15);
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: 0.5s;
        }

        .card:hover img { filter: brightness(1.1); }

        .card-body { padding: 20px; }
        
        .card-body h3 {
            margin: 0;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--secondary);
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary);
            color: #000;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Contact Section */
        .contact-box {
            margin: 100px 5% 50px;
            padding: 60px 20px;
            background: var(--glass);
            border-radius: 30px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .social-link {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            text-decoration: none;
            transition: 0.4s;
            border: 1px solid var(--border);
        }

        .social-link:hover {
            background: var(--primary);
            color: #000;
            transform: rotate(10deg) scale(1.1);
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.8rem;
            color: #555;
            letter-spacing: 2px;
        }

    </style>
</head>
